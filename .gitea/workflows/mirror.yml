name: GitHub Git mirror
on:
  push:
    branches: ['**']
    tags: ['**']
  create:
  delete:
  schedule:
    - cron: '29 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alphapulse-github-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: docker
    timeout-minutes: 15
    container:
      image: docker:29-cli
      volumes:
        - /docker/gitea/mirrors/AlphaPulse:/docker/gitea/mirrors/AlphaPulse
    steps:
      - name: Install mirror tools
        run: apk add --no-cache python3 nodejs git git-lfs
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Reconcile the current source references
        env:
          ALPHAPULSE_GITHUB_SSH_KEY: ${{ secrets.ALPHAPULSE_GITHUB_SSH_KEY }}
        run: python3 scripts/mirror.py
