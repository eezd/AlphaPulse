name: Manual release
run-name: Release ${{ inputs.source_branch }}
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Remote source branch (frozen when execution starts)
        required: true
        default: main
        type: string
      source_sha:
        description: Optional full SHA; leave empty for branch HEAD
        required: false
        default: ''
        type: string
concurrency:
  group: alphapulse-delivery
  cancel-in-progress: false
jobs:
  release:
    if: forgejo.ref == 'refs/heads/main'
    runs-on: docker
    timeout-minutes: 115
    container:
      image: node:24-bookworm
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install release tools
        run: |
          apt-get update
          apt-get install -y python3 python3-venv skopeo ca-certificates curl
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable' > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y docker-ce-cli docker-buildx-plugin
          curl -LsSf https://astral.sh/uv/0.13.6/install.sh | sh
          cp /root/.local/bin/uv /usr/local/bin/uv
          uv python install 3.13 --no-bin
          corepack enable
          corepack prepare pnpm@12.11.2 --activate
      - name: Resolve source once
        id: source
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROL_REF: ${{ forgejo.ref }}
          CONTROL_SHA: ${{ forgejo.sha }}
          CI_RUN_ID: ${{ forgejo.run_id }}
          FORGEJO_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_CONTEXT: ${{ runner.temp }}/alphapulse-release-${{ forgejo.run_id }}-${{ forgejo.run_attempt }}.json
        run: python3 scripts/resolve-release.py
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Build and publish fixed source once
        env:
          CONTROL_REF: ${{ forgejo.ref }}
          CONTROL_SHA: ${{ forgejo.sha }}
          RELEASE_CONTEXT: ${{ runner.temp }}/alphapulse-release-${{ forgejo.run_id }}-${{ forgejo.run_attempt }}.json
          FORGEJO_API_URL: ${{ forgejo.server_url }}/api/v1
          FORGEJO_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CI_RUN_ID: ${{ forgejo.run_id }}
          CI_RUN_ATTEMPT: ${{ forgejo.run_attempt }}
          CI_RESOURCE_LABEL: io.alphapulse.ci.run=release-${{ forgejo.run_id }}-${{ forgejo.run_attempt }}
          DOCKER_CONFIG: ${{ runner.temp }}/alphapulse-release-auth-${{ forgejo.run_id }}-${{ forgejo.run_attempt }}
        run: |
          mkdir -m 700 -p "$DOCKER_CONFIG"
          uv run --no-project --managed-python --no-python-downloads --python 3.13 python scripts/manual-release.py
      - name: Clean only this run
        if: always()
        env:
          CI_RUN_ID: ${{ forgejo.run_id }}
          CI_RUN_ATTEMPT: ${{ forgejo.run_attempt }}
          DOCKER_CONFIG: ${{ runner.temp }}/alphapulse-release-auth-${{ forgejo.run_id }}-${{ forgejo.run_attempt }}
        run: |
          status=0
          python3 scripts/release-candidate.py --cleanup || status=$?
          rm -rf -- "$DOCKER_CONFIG"
          rm -f -- "${{ runner.temp }}/alphapulse-release-${{ forgejo.run_id }}-${{ forgejo.run_attempt }}.json"
          exit "$status"
